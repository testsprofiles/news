<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yangilik | Yangiliklar Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }
    .spinner { border: 3px solid #f3f4f6; border-top-color: #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header minim -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-gray-700 hover:text-gray-900 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span class="font-medium hidden sm:inline">Ga'riq</span>
      </a>
      <div class="flex items-center gap-2">
        <a href="login.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition px-3 py-1.5 rounded-lg hover:bg-gray-100">
          Kirish
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Loading -->
    <div id="loadingPost" class="flex justify-center py-16 hidden">
      <div class="spinner"></div>
    </div>

    <!-- Error -->
    <div id="errorState" class="bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-lg hidden mb-6">
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="errorText">Ma'lumot olinmadi.</span>
      </div>
    </div>

    <!-- Post Detail -->
    <article id="postDetail" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hidden">
      <!-- Image -->
      <div class="relative h-56 sm:h-72 bg-gradient-to-br from-gray-100 to-gray-200">
        <img id="postImage" class="w-full h-full object-cover" alt="">
        <div class="absolute top-4 left-4">
          <span id="postCategory" class="inline-flex items-center px-3 py-1 text-xs font-medium bg-white/90 backdrop-blur-sm rounded-full shadow text-gray-700 border border-gray-200"></span>
        </div>
      </div>

      <div class="p-6 sm:p-8">
        <!-- Date & reading -->
        <div class="flex flex-wrap items-center justify-between gap-3 text-sm text-gray-500 mb-4">
          <time id="postDate" class="inline-flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span></span>
          </time>
          <span id="postReadTime" class="inline-flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.168 18.477 17.584 18 16.5 18c-.832 0-1.754.477-2.5 1.253"/></svg>
            <span></span>
          </span>
        </div>

        <!-- Title -->
        <h1 id="postTitle" class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4 leading-tight"></h1>

        <!-- Content -->
        <div id="postContent" class="prose prose-gray max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap"></div>

        <hr class="my-6 border-gray-200">

        <!-- Share / Action row -->
        <div class="flex items-center justify-between">
          <button id="sharePostBtn" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 115.367-2.684 3 3 0 01-5.367 2.684zm0 9.316a3 3 0 110-9.316 3 3 0 010 9.316zm0-13.632a3 3 0 110-9.316 3 3 0 010 9.316z"/></svg>
            Baham ko'rish
          </button>
          <button id="backToListBtn" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">
            ← Yangiliklarga qaytish
          </button>
        </div>
      </div>

      <!-- Author card -->
      <div class="bg-gray-50 border-t border-gray-200 p-5 flex items-center gap-4">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-semibold">
          <span id="postAuthorInitial"></span>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-900" id="postAuthorName">Portal</p>
          <p class="text-xs text-gray-400">Ma'lumot</p>
        </div>
      </div>
    </article>

    <!-- Comments Section -->
    <section class="mt-8 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
          Izohlar
        </h2>
        <span id="commentCount" class="text-sm text-gray-500">0 ta</span>
      </div>

      <div id="loginPrompt" class="px-6 py-5 bg-blue-50 border-b border-blue-100 hidden">
        <div class="flex items-start gap-3">
          <svg class="w-5 h-5 text-blue-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          <div>
            <p class="text-sm font-medium text-blue-900">Izoh qoldirish uchun kirishingiz kerak</p>
            <p class="text-sm text-blue-700 mt-0.5"><a href="login.html" class="underline hover:text-blue-900">Kirish yoki ro'yxatdan o'ting</a></p>
          </div>
        </div>
      </div>

      <!-- Comment Form -->
      <form id="commentForm" class="px-6 py-4 border-b border-gray-200 hidden">
        <div class="mb-3">
          <label for="commentText" class="block text-sm font-medium text-gray-700 mb-1">Izoh matni</label>
          <textarea id="commentText"
                    rows="3"
                    required
                    minlength="5"
                    maxlength="1000"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-none text-sm"
                    placeholder="Fikr yoki izohingizni yozing (5–1000 belgi)..."></textarea>
          <p id="commentCharCount" class="mt-1 text-xs text-gray-400 text-right">0 / 1000</p>
        </div>
        <div class="flex items-center justify-between gap-3">
          <button type="submit" id="commentSubmitBtn" class="px-5 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            Qo'shish
          </button>
          <div id="commentFormError" class="text-sm text-red-600 hidden"></div>
        </div>
      </form>

      <!-- Comments List -->
      <div id="commentsList" class="divide-y divide-gray-100">
        <!-- Comments injected -->
      </div>

      <!-- Empty comments -->
      <div id="emptyComments" class="px-6 py-10 text-center hidden">
        <div class="w-12 h-12 mx-auto mb-3 bg-gray-100 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </div>
        <p class="text-gray-500 text-sm">Hozircha izohlar yo'q</p>
      </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-lg hidden flex items-center gap-3 text-sm max-w-xs w-full sm:w-auto">
      <span id="toastMessage"></span>
    </div>
  </main>
</body>
</html>
